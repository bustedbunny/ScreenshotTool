name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw 'Release tags must use vX.Y.Z.' }
          $source = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($source -notmatch 'project\(ScreenshotTool VERSION ([0-9]+\.[0-9]+\.[0-9]+) ') { throw 'Project version was not found.' }
          $version = $Matches[1]
          if ($tag -cne "v$version") { throw "Tag $tag does not match project version $version." }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, test, and package
        shell: pwsh
        run: ./package.ps1 -ConfigurePreset windows-x64-vs2026
      - name: Validate installer lifecycle
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1 -InstallerPath "release-assets/ScreenshotTool-$env:RELEASE_VERSION-windows-x64-setup.exe" -SourceDir dist -InstallerScript build/release-packaging/generated/ScreenshotTool.iss -IsccPath build/tools/InnoSetup-6.7.3/ISCC.exe -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            build/release-packaging/Testing/Temporary/LastTest.log
            build/installer-validation/**
          if-no-files-found: ignore
      - name: Upload assets to draft and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to alter an already published release.' }
          } else {
            gh release create $tag --repo $repo --verify-tag --draft --title "ScreenshotTool $env:RELEASE_VERSION" --notes-file "docs/releases/$env:RELEASE_VERSION.md"
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          $names = @('ScreenshotTool.exe', "ScreenshotTool-$env:RELEASE_VERSION-windows-x64.zip", "ScreenshotTool-$env:RELEASE_VERSION-windows-x64-setup.exe")
          $paths = @($names | ForEach-Object { "release-assets/$_" })
          gh release upload $tag --repo $repo --clobber @paths
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; the release remains a draft.' }
          # Draft releases are only returned through the release collection, not the tag endpoint.
          $metadata = gh api "repos/$repo/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Release asset verification failed.' }
          $matchingReleases = @(
            foreach ($page in ($metadata | ConvertFrom-Json)) {
              $page | Where-Object { $_.tag_name -ceq $tag }
            }
          )
          if ($matchingReleases.Count -ne 1 -or -not $matchingReleases[0].draft) { throw 'Expected one draft release before asset verification.' }
          $assets = $matchingReleases[0].assets
          foreach ($name in $names) {
            $asset = @($assets | Where-Object { $_.name -ceq $name -and $_.size -gt 0 -and $_.state -ceq 'uploaded' })
            if ($asset.Count -ne 1) { throw "Uploaded asset $name is missing, duplicate, or empty." }
            $hash = (Get-FileHash -LiteralPath "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -cne "sha256:$hash" -or $asset[0].size -ne (Get-Item -LiteralPath "release-assets/$name").Length) { throw "Uploaded asset $name has no matching size and SHA-256 digest." }
          }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
